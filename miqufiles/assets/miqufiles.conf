# ==============================================================================
# MiquFiles Configuration File
# Modern Yazi-style Miller Columns File Manager for Miqu Desktop
# ==============================================================================

# Dynamic theming token source from miqutheme
source = ~/.config/miqutheme/current/miqutoolkit.conf

[general]
# Initial window dimensions
window_width = 1100
window_height = 700

# Default starting directory (~ for user home directory)
default_path = ~

# Show hidden files and directories (dotfiles) by default
show_hidden = false

# Enable vim-style navigation keys (h/j/k/l, g/G)
vim_keys = true

# Terminal launcher command when opening terminal in directory
terminal_cmd = alacritty

[preview]
# Maximum lines to read and display for text/code preview
preview_max_text_lines = 250

# Maximum file size in kilobytes (KB) to attempt text preview
preview_max_file_size_kb = 1024

# Quality mode for image previews (FullOriginal or ThumbnailFast)
image_preview_quality = FullOriginal
