<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    <linearGradient id="folderFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E3F2FD" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="13.5" y="13.5" width="101" height="101" rx="26.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" />

  <!-- Sheet of paper / file document peeking out -->
  <path d="M 44 38 L 74 38 L 84 48 L 84 82 L 44 82 Z" fill="url(#cardGrad)" rx="3" filter="url(#dropShadow)" />
  <!-- Corner fold on document -->
  <path d="M 74 38 L 74 48 L 84 48 Z" fill="#BBDEFB" />
  <line x1="52" y1="56" x2="76" y2="56" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round" />
  <line x1="52" y1="64" x2="72" y2="64" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round" />
  <line x1="52" y1="72" x2="66" y2="72" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round" />

  <!-- Front folder flap -->
  <path d="M 28 54 L 46 54 L 54 62 L 100 62 C 103 62 105 64 105 67 L 100 92 C 99 95 97 97 94 97 L 34 97 C 31 97 29 95 28 92 L 25 57 C 25 55 26 54 28 54 Z" 
        fill="url(#folderFront)" filter="url(#dropShadow)" />
</svg>
