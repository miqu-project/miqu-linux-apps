# ==============================================================================
# miqulock Configuration File
# Modern Wayland Session Locker for Miquland
# ==============================================================================

# ==============================================================================
# Section 1: Lock Screen Options
# ==============================================================================
time_format = %H:%M
date_format = %A, %B %d
show_power_actions = true

# ==============================================================================
# Section 2: Toolkit Appearance Overrides (Optional)
#
# The following settings are inherited automatically from:
#   ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config)
#   /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit defaults)
#
# Uncomment any setting below to override it for miqulock only.
# Leave commented to inherit from miqutoolkit.
# ==============================================================================
# font = Sans
# font_size = 11
# corner_radius = 18
# border_width = 1
# icon_theme = Papirus
#
# --- Custom Palette Overrides ---
# primary = #6366f1
# on_primary = #ffffff
# primary_container = #e0e7ff
# background = #f7f7fc
# surface = #ffffff
# on_surface = #1a1a2e
# outline = #d5d8ea
# error = #ef4444
