[General]
# Default Wayland session ID or name
default_session=miquland

# Remember last logged in user across restarts
remember_last_user=true

# Last logged in user (managed automatically)
last_user=

# Command to launch the greeter compositor and greeter UI on VT
greeter_command=miquland -s /usr/bin/miqudm-greeter

# User account under which greeter runs (e.g. sddm, greeter, or miqudm)
greeter_user=sddm

# Virtual terminal number (0 for auto allocation or current VT)
vt=1

# Enable NumLock on startup
numlock=false

[Autologin]
enabled=false
user=
session=miquland
