# ==============================================================================
# miqudm Configuration — Miqu Desktop Ecosystem
# Authoritative System Configuration (/etc/miqudm/miqudm.conf)
# ==============================================================================
#
# CONFIGURATION & THEMING ARCHITECTURE:
#
# 1. System Authority Model:
#    miqudm is a pre-session Display Manager running before any user logs in.
#    Because it runs as an unprivileged system service (greeter user), it does
#    NOT look for user home configurations (~/.config/).
#
# 2. File Resolution Order:
#    • Primary Authority: /etc/miqudm/miqudm.conf
#    • System Baseline:   /usr/share/miqudm/miqudm.conf
#    • CLI Override:      miqudm-greeter -c /path/to/custom.conf
#
# 3. Toolkit & Theme Division of Responsibility:
#    • miqutoolkit provides the core Wayland surface engine, Cairo/Pango text
#      rendering, input handling, and reusable widgets (CardView, AvatarView,
#      EditText, Button, Spinner).
#    • This file (/etc/miqudm/miqudm.conf) defines the specific login screen
#      behavior, wallpaper, geometry, and color palette ([Theme]) directly.
# ==============================================================================

[General]
# Default desktop session ID (e.g. miquland, sway, hyprland)
default_session = miquland

# Remember last logged in user across restarts
remember_last_user = true

# Last logged in user (managed automatically by miqudm daemon)
last_user =

# Command to launch the greeter compositor and greeter UI.
# Can be cage (kiosk), miquland, labwc, or any Wayland compositor supporting single-app kiosk.
greeter_command = cage -s -- /usr/bin/miqudm-greeter

# User account under which greeter runs
greeter_user = greeter

# Virtual terminal number (1 for tty1)
vt = 1

# Enable NumLock on startup
numlock = false

[Greeter]
# Path to custom background wallpaper (leave empty for solid canvas)
wallpaper =

# Clock display format (true = 24-hour, false = 12-hour AM/PM)
clock_format_24h = true

# Show system power buttons (Suspend, Reboot, Shut Down)
show_power_buttons = true

# Show desktop session picker dropdown
show_sessions = true

# Allow switching between system users
allow_user_switching = true

# Visual geometry metrics
card_radius = 20
avatar_size = 84

[Theme]
# Vibrant, colorful light theme palette for miqudm-greeter
background = #f6f0fa
on_background = #1d192b
surface = #ffffff
on_surface = #1d192b
surface_variant = #f0eaf7
on_surface_variant = #49454f
primary = #6750a4
on_primary = #ffffff
primary_container = #eaddff
on_primary_container = #21005d
outline = #79747e
outline_variant = #d0c8da
backdrop = #00000033
