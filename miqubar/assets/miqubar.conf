# ==============================================================================
# miqubar Configuration File
# Wayland Status Bar & Windows-Style Taskbar built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 2: Toolkit Appearance Overrides (Optional)
#
# The following settings are inherited automatically from:
#   ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config)
#   /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit defaults)
#
# Uncomment any setting below to override it for miqubar only.
# Leave commented to inherit from miqutoolkit.
# ==============================================================================
# font = Sans
# font_size = 11
# corner_radius = 8
# border_width = 1
# icon_theme = hicolor
#
# --- Custom Palette Overrides ---
# primary = #ff5778
# surface = #131722
# on_surface = #edf2f7
# surface_variant = #1a2030
# on_surface_variant = #8c96a8
# outline = rgba(255, 255, 255, 0.08)

# ==============================================================================
# Section 1: Application Options
# ==============================================================================

[general]
# Bar placement: bottom (Windows style) or top
position = bottom

# Total bar height in pixels
height = 42

# Reserve screen space so windows do not overlap the bar (0 to disable)
exclusive_zone = 42

# Background opacity (0.0 to 1.0, 1.0 = fully opaque)
opacity = 0.96

[start]
# Show the Miqu Start button
show_start = true

# Command to execute when clicking Start (default launches miqulauncher)
launcher_cmd = miqulauncher

# Start icon dimensions in pixels
icon_size = 22

[workspaces]
# Show the workspace button next to Start
show_workspace_btn = true

# Display mode: badge (compact with active workspace number badge) or strip (all numbers)
workspace_display = badge

# Open floating workspace flyout when hovering or clicking the workspace button
hover_flyout = true

# Scroll mouse wheel on workspace button to cycle active workspace immediately
scroll_switch = true

[taskbar]
# Show running application tabs (zwlr_foreign_toplevel_manager)
show_taskbar = true

# If true, show only application icons without window title labels
icon_only = false

# Maximum characters in window title before truncating with ellipsis
max_title_chars = 24

# Maximum width per taskbar window tab in pixels
item_max_width = 200

# Show colorful accent underline under the active window tab
show_active_underline = true

# Middle-click on taskbar tab closes the window
middle_click_close = true

[modules]
# Hardware & system status modules in the right tray
show_cpu = true
show_memory = true
show_volume = true
show_battery = true
show_clock = true
show_peek = true

# Clock formatting:
# Stacked mode displays time on top and date underneath (Windows 10/11 style)
clock_stacked = true
time_format = %H:%M
date_format = %d/%m/%Y

# Telemetry refresh interval in milliseconds
telemetry_interval_ms = 2000
