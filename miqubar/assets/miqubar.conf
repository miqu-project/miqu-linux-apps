# ==============================================================================
# miqubar Configuration File
# Wayland Status Bar & Windows-Style Taskbar built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 1: Application Options
# ==============================================================================

[general]
# Bar placement: bottom (Windows style) or top
position = bottom

# Total bar height in pixels
height = 48

# Reserve screen space so maximized and tiled windows do not overlap the bar (default: true)
# When true, automatically calculates (height + vertical margin). Set to false for overlay mode.
reserve_space = true

# Corner radius for the bar window in pixels (defaults to miqutoolkit corner_radius if empty)
bar_corner_radius = 0

# Draw an outline border around the bar window (default: false)
miqubar_outline = false

# Floating margins from screen edges in pixels (default 0 for docked edge bar)
# Set these to turn miqubar into a modern floating bar
margin_top = 0
margin_bottom = 0
margin_left = 0
margin_right = 0
# Shorthands: margin_horizontal, margin_vertical

# Internal padding inside the bar in pixels (default: 4px top/bottom, 6px left/right)
# Set padding_vertical = 0 if you want modules to fill the full bar height
padding_left = 6
padding_right = 6
padding_top = 4
padding_bottom = 4
# Shorthands: padding_horizontal, padding_vertical


[start]
# Show the Miqu Start button
show_start = true

# Icon for the Start button (default: miquland)
start_icon = miquland

# Command to execute when clicking Start (default launches miqulauncher)
launcher_cmd = miqulauncher

# Start and taskbar icon dimensions in pixels
icon_size = 28

[workspaces]
# Show the workspace button next to Start
show_workspace_btn = true

# Display mode: icon (Task View icon with dots), dots (dot strip), or badge (compact number pill)
workspace_display = icon

# Open floating workspace flyout when hovering or clicking the workspace button
hover_flyout = true

# Scroll mouse wheel on workspace button to cycle active workspace immediately
scroll_switch = true

[search]
# Show the search button/pill on the left, next to the workspace button
show_search = true

# Search button style: pill (search bar with icon and text) or icon (compact button)
search_style = pill

# Command to execute when clicking search (default launches miqulauncher in universal search mode)
search_cmd = miqulauncher -show search

# Width of search pill in pixels when search_style is pill
search_width = 160

# Placeholder text displayed inside the search pill
search_placeholder = Search

[taskbar]
# Show running application tabs (zwlr_foreign_toplevel_manager)
show_taskbar = true

# Group multiple windows of the same application into a single taskbar button
group_apps = true

# If true, show only application icons without window title labels
icon_only = true

# Maximum characters in window title before truncating with ellipsis (when icon_only = false)
max_title_chars = 24

# Maximum width per taskbar window tab in pixels (when icon_only = false)
item_max_width = 200

# Show colorful accent underline under the active window tab
show_active_underline = true

# Middle-click on taskbar tab closes the window
middle_click_close = true

# On hover over taskbar item, show floating preview popup with full title and app info
show_hover_popup = true

# Maximum width for hover preview popup in pixels
hover_popup_max_width = 320

# Debounce delay in milliseconds before hover preview popup appears
hover_delay_ms = 300

[modules]
# Hardware & system status modules in the right tray
show_cpu = false
show_memory = false
show_network = true
show_bluetooth = true
show_volume = true
show_brightness = true
show_battery = true
show_dark_mode = true
show_notifications = true
show_clock = true
show_peek = true

# Clock formatting:
# Stacked mode displays time on top and date underneath (Windows 10/11 style)
clock_stacked = true
time_format = %H:%M
date_format = %d/%m/%Y

# Telemetry refresh interval in milliseconds
telemetry_interval_ms = 2000

