<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFCDD2" stop-opacity="0.8" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle with shadow -->
  <rect x="12" y="12" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Inner border ring -->
  <rect x="13.5" y="13.5" width="101" height="101" rx="26.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3" />

  <!-- Power icon symbol -->
  <!-- Top vertical pin -->
  <line x1="64" y1="36" x2="64" y2="60" stroke="url(#glowGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Arc ring -->
  <path d="M 44.5 48 A 30 30 0 1 0 83.5 48" fill="none" stroke="url(#glowGrad)" stroke-width="10" stroke-linecap="round" />
</svg>
