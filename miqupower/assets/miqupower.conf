# ==============================================================================
# MiquPower Configuration File
# Authoritative Desktop Environment Power & Session Management
# ==============================================================================

# Dynamic theming token source from miqutheme
source = ~/.config/miqutheme/current/miqutoolkit.conf

[general]
# Width and height of the power dialog card
width = 720
height = 460

# Backdrop dimming and window behavior
dim_backdrop = true
close_on_click_outside = false
close_on_escape = true

# Running application safety warning
# When true, checks for running applications before shutdown/reboot/logout
warn_running_apps = true
max_running_apps = 6

# Graceful shutdown timeout in milliseconds for miquland before force exit
graceful_timeout_ms = 2500

# Automatically lock screen before system suspension or hibernation
lock_before_suspend = true

[actions]
# Toggle individual power actions in the menu
enable_shutdown = true
enable_reboot = true
enable_suspend = true
enable_lock = true
enable_logout = true
enable_hibernate = false

# Custom execution command overrides (leave empty for standard systemd/miquland defaults)
# lock_cmd = miqulock
# shutdown_cmd =
# reboot_cmd =
# suspend_cmd =
# logout_cmd =
