[global]
    frame_color = "#000000"

[urgency_low]
    background = "#f3f3f3"
    foreground = "#2d2d2d"
    frame_color = "#4a4a4a"

[urgency_normal]
    background = "#f9f9f9"
    foreground = "#000000"
    frame_color = "#000000"

[urgency_critical]
    background = "#c32220"
    foreground = "#ffffff"
    frame_color = "#700005"
