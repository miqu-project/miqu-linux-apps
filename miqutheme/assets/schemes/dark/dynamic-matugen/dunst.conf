[global]
    frame_color = "#ffffff"

[urgency_low]
    background = "#1b1b1b"
    foreground = "#c6c6c6"
    frame_color = "#919191"

[urgency_normal]
    background = "#131313"
    foreground = "#e2e2e2"
    frame_color = "#ffffff"

[urgency_critical]
    background = "#93000a"
    foreground = "#ffdad6"
    frame_color = "#ffb4ab"
