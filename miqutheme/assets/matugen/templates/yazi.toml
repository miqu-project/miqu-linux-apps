[manager]
cwd = { fg = "{{colors.primary.default.hex}}" }
hovered = { bg = "{{colors.surface_container_high.default.hex}}", fg = "{{colors.on_surface.default.hex}}" }
preview_hovered = { bg = "{{colors.surface_container_low.default.hex}}" }

find_keyword = { fg = "{{colors.primary.default.hex}}", bold = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", italic = true }

marker_copied = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error_container.default.hex}}" }
marker_marked = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
marker_selected = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary_container.default.hex}}" }

tab_active = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}", bold = true }
tab_inactive = { bg = "{{colors.surface_container_low.default.hex}}", fg = "{{colors.on_surface_variant.default.hex}}" }


count_copied = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
count_cut = { fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" }
count_selected = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

border_symbol = "│"
border_style = { fg = "{{colors.outline.default.hex}}" }

[status]
normal = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}", bold = true }
select = { bg = "{{colors.secondary.default.hex}}", fg = "{{colors.on_secondary.default.hex}}", bold = true }
unset = { bg = "{{colors.error.default.hex}}", fg = "{{colors.on_error.default.hex}}", bold = true }
progress_label = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface.default.hex}}" }

[mode]
normal_main = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}", bold = true }
normal_alt = { bg = "{{colors.surface_container_high.default.hex}}", fg = "{{colors.primary.default.hex}}" }
select_main = { bg = "{{colors.secondary.default.hex}}", fg = "{{colors.on_secondary.default.hex}}", bold = true }
select_alt = { bg = "{{colors.surface_container_high.default.hex}}", fg = "{{colors.secondary.default.hex}}" }
unset_main = { bg = "{{colors.error.default.hex}}", fg = "{{colors.on_error.default.hex}}", bold = true }
unset_alt = { bg = "{{colors.surface_container_high.default.hex}}", fg = "{{colors.error.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
value = { fg = "{{colors.on_surface.default.hex}}" }
selected = { bg = "{{colors.primary_container.default.hex}}" }

[select]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[tasks]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
hovered = { bg = "{{colors.surface_container_high.default.hex}}", fg = "{{colors.on_surface.default.hex}}" }

[which]
mask = { bg = "{{colors.surface_container_low.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}" }
rest = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc = { fg = "{{colors.on_surface.default.hex}}" }
separator_style = { fg = "{{colors.outline.default.hex}}" }

[help]
on = { fg = "{{colors.primary.default.hex}}" }
exec = { fg = "{{colors.tertiary.default.hex}}" }
desc = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { bg = "{{colors.surface_container_high.default.hex}}", bold = true }
footer = { bg = "{{colors.surface.default.hex}}", fg = "{{colors.on_surface.default.hex}}" }

[filetree]
folder = { fg = "{{colors.primary.default.hex}}" }
