# ==============================================================================
# miqulauncher Configuration File
# Modern app launcher, window switcher, and dmenu built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 1: Window & Grid Layout
# ==============================================================================
width = 800
height = 460
cell_size = 100
spacing = 10
edge_padding = 40

# Show descriptive subtitles across tabs (app generic names, window state, etc.)
show_subtitles = true

# Draw a 1px border around the highlighted/selected grid item
selection_border = false

# Draw a primary accent border outline when search bar is focused
search_focus_border = false

# Width of centered search bar as a percentage of window width (e.g. 55 for 55%, 100 for full width)
search_width_percent = 55

# Height in pixels of the search pill (conventional standard is 36px)
search_height = 36

# Elevation level for the search pill (0 for flat, 1-4 for ambient floating drop shadow)
search_elevation = 1

# Presentation mode: grid (multi-column app tiles) or list (compact horizontal rows)
view_mode = grid

# Presentation mode specifically when running in dedicated -show search mode
# options: inherit (matches view_mode), list, or grid
search_view_mode = inherit

# ==============================================================================
# Section 2: Toolkit Appearance Overrides (Optional)
#
# The following settings are inherited automatically from:
#   ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config)
#   /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit defaults)
#
# Uncomment any setting below to override it for miqulauncher only.
# Leave commented to inherit from miqutoolkit.
# ==============================================================================
