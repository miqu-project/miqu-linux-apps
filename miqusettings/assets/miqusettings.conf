# ==============================================================================
# MiquSettings Configuration File
# Modern Miller-Columns Centralized System Settings for Miqu Desktop
# ==============================================================================

# Dynamic theming token source from miqutheme
source = ~/.config/miqutheme/current/miqutoolkit.conf

[general]
# Initial window dimensions
window_width = 1150
window_height = 740

# Enable vim-style navigation keys (h/j/k/l)
vim_keys = true
