# ==============================================================================
# miquoverview Configuration
# GPU-accelerated workspace expose and overview plugin for miquland
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Dimensions & Metrics
# ------------------------------------------------------------------------------
edge_margin   = 48
corner_radius = 12
font          = Sans Bold 10

# ------------------------------------------------------------------------------
# 2. Visual Effects: Animation, Blur & Shadows
# ------------------------------------------------------------------------------
# Fluid VSync-locked open/close transitions
animation     = true
duration      = 200

# GPU Dual Kawase frosted glass backdrop blur
blur          = true
blur_alpha    = 1.0

# GPU box drop shadows for workspace cards
shadow        = true
shadow_radius = 16
shadow_blur   = 18.0
shadow_color  = #000000aa

# ------------------------------------------------------------------------------
# 3. Baseline Fallback Theme (Used if 'source' is omitted or commented out)
# ------------------------------------------------------------------------------
background          = #11131cb0
backdrop            = #00000080
surface             = #151924f5
surface_variant     = #1f2537f0
on_surface          = #e6ecf8
on_surface_variant  = #8a99b5
primary             = #40a0ff
on_primary          = #ffffff
outline             = #2e384d80
outline_variant     = #4070b099

# ------------------------------------------------------------------------------
# 3. Dynamic Theme Integration (Optional)
# ------------------------------------------------------------------------------
# Uncomment the line below to dynamically synchronize colors with your active
# desktop wallpaper and theme palette:
# source = ~/.config/miqutheme/current/miqutoolkit.conf
