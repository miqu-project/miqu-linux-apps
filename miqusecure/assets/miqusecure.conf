# ==============================================================================
# miqusecure Configuration File
# Modern native privacy & security control center built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 1: Application Options
# ==============================================================================
default_tab = 0           # 0: Firewall, 1: Traffic, 2: DNS, 3: Cleaner, 4: Hardware, 5: Sandbox, 6: Testbed
auto_refresh_seconds = 5

# ==============================================================================
# Section 2: Toolkit Appearance Overrides (Optional)
