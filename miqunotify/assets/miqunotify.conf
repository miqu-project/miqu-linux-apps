# ==============================================================================
# miqunotify Configuration File
# Modern Wayland Notification Daemon & Center built with miqutoolkit
# ==============================================================================

# ==============================================================================
# Section 1: Application Options
# ==============================================================================

[general]
# Toast banner anchor position: top-right, top-left, bottom-right, bottom-left
position = top-right

# Default display timeout in milliseconds for normal notifications (0 = persistent)
timeout_ms = 5000

# Maximum number of visible notification toast banners at the same time
max_toasts = 5

# Width of notification toast banners in pixels
toast_width = 380

# Vertical spacing in pixels between stacked toast banners
toast_spacing = 10

# Horizontal and vertical margins in pixels from the screen edge
margin_x = 16
margin_y = 16

# Initial Do Not Disturb state (if true, toasts are suppressed and saved to center)
dnd_enabled = false

# Maximum number of notifications kept in history
history_limit = 100

# Width of the slide-out Notification Center panel in pixels
center_width = 400

# Horizontal and vertical margins in pixels for the Notification Center drawer
center_margin_x = 10
center_margin_y = 10

# Enable verbose operational and debug logging to stdout/stderr
debug = false

# Group notifications by application name in the Notification Center drawer
group_by_app = true

# ==============================================================================
# Section 2: Toolkit Appearance Overrides (Optional)
#
# The following settings are inherited automatically from:
#   ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config)
#   /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit defaults)
#
# Uncomment any setting below to override it for miqunotify only.
# Leave commented to inherit from miqutoolkit.
# ==============================================================================
